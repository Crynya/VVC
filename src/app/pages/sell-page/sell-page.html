

<div class="main-container">
  <app-sidebar-component (filtersChanged)="loadCars($event)"></app-sidebar-component>
  <section class="car-list">
    <h2>Mes annonces</h2>
    <div *ngFor="let car of cars$ | async">
      <app-car-component [car]="car"></app-car-component>
    </div>
  </section>
</div>
