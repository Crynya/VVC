
<div class="edit-form">
  <form [formGroup]="editForm" (ngSubmit)="saveChanges()">
    <label for="name">Nom du centre</label>
    <input id="name" formControlName="name" />

    <label for="address">Adresse</label>
    <input id="address" formControlName="address" />

    <label for="numeroTel">Téléphone</label>
    <input id="numeroTel" formControlName="numeroTel" />

    <label for="horaire">Horaire</label>
    <input id="horaire" formControlName="horaire" />

    <label for="latitude">Latitude</label>
    <input id="latitude" formControlName="latitude" type="number" step="0.000001" />

    <label for="longitude">Longitude</label>
    <input id="longitude" formControlName="longitude" type="number" step="0.000001" />

    <div class="form-actions">
      <button type="submit" class="btn-save">Enregistrer</button>
      <button type="button" class="btn-cancel" (click)="cancel()">Annuler</button>
    </div>
  </form>
</div>
