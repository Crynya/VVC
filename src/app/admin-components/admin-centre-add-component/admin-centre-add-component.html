
<div class="edit-form">
  <form [formGroup]="addForm" (ngSubmit)="createCentre()">
    <label for="name">Nom du centre</label>
    <input id="name" formControlName="name" placeholder="Exemple : Mons, Namur, ..." />

    <label for="address">Adresse</label>
    <input id="address" formControlName="address" placeholder="Exemple : Bd de l'Humanité 111, 1601 Sint-Pieters-Leeuw"/>

    <label for="numeroTel">Téléphone</label>
    <input id="numeroTel" formControlName="numeroTel" placeholder="Exemple : +32 2 45 67 89 0"/>

    <label for="horaire">Horaire</label>
    <input id="horaire" formControlName="horaire" placeholder="Exemple : 8H00-20H00"/>

    <label for="latitude">Latitude</label>
    <input id="latitude" formControlName="latitude" type="number" step="0.000001" />

    <label for="longitude">Longitude</label>
    <input id="longitude" formControlName="longitude" type="number" step="0.000001" />

    <div class="form-actions">
      <button type="submit" class="btn-save">Créer</button>
      <button type="button" class="btn-cancel" (click)="cancel()">Annuler</button>
    </div>
  </form>
</div>
